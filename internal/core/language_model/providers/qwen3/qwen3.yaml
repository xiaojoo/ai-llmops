model: qwen3
label: "本地模型（OpenAI 兼容）"
model_type: chat
features:
  - tool_call
  - agent_thought
context_window: 262144
max_output_tokens: 16384
# model / base_url / api_key 不在此写死：均由 chat.py 读取环境变量
# LOCAL_LLM_MODEL / LOCAL_LLM_API_BASE / LOCAL_LLM_API_KEY（/settings 页可配置），
# 因此本地端点加载任意 OpenAI 兼容模型（Qwen / Llama / DeepSeek 等）都可用。
attributes: {}
parameters:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    max: 16384
metadata:
  pricing:
    input: 0.0001
    output: 0.0001
    unit: 0.001
    currency: RMB
  # 界面展示用：该模型的请求 model id 来自环境变量 LOCAL_LLM_MODEL（/settings 可配置），
  # 应用列表/详情的模型显示名据此解析（缺省回退 label）。
  model_name_env: LOCAL_LLM_MODEL