server {
    listen 80;
    server_name _;

    # 将/api的请求代理到5001端口上(llmops-api服务)
    location /api/ {
        proxy_pass http://llmops-api:5001;

        # 修复路径，避免/api后面的路径丢失
        rewrite ^/api/(.*)$ /$1 break;
        include proxy.conf;

        # 显示Nginx默认错误页面
        proxy_intercept_errors off;
    }

    # 将/的请求转发到3000端口上(llmops-ui服务)
    location / {
        proxy_pass http://llmops-web:3000;
        include proxy.conf;
    }
}