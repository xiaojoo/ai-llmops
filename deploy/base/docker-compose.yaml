# ═════════════════════════════════════════════════════════════════════════
# deploy/base 基础环境编排：PostgreSQL + Redis + Weaviate + MinIO + 腾讯记忆
#
# 用法：
#   cp .env.example .env        # 编辑必填项
#   ./deploy.sh up              # 一键拉起（deploy.sh 会先生成腾讯记忆的配置文件）
#
# 服务名（容器名）：db / redis / weaviate / minio / memory-core / memory-hub / memory-proxy
# 网络：base-net（应用容器后续可通过该网络 + 服务名直连，见 README）
# ═════════════════════════════════════════════════════════════════════════

name: base

services:
  db:
    image: postgres:18-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-llmdb}
    volumes:
      # PG18+ 镜像要求挂载父目录 /var/lib/postgresql（数据存版本化子目录），
      # 挂 /var/lib/postgresql/data 会报 "data in unused mount/volume" 拒绝启动
      - ./volumes/db:/var/lib/postgresql
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-llmdb}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    volumes:
      - ./volumes/redis/data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  weaviate:
    image: semitechnologies/weaviate:1.28.4
    container_name: weaviate
    restart: always
    environment:
      QUERY_DEFAULTS_LIMIT: 25                    # 查询默认返回条数
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'  # 关闭匿名访问
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: 'none'
      # 单节点部署不要设 CLUSTER_HOSTNAME：weaviate 会按该名字去 DNS 解析自己的
      # advertise IP（memberlist/gossip），'node1' 在容器内解析不到会报
      # "No private IP address found" 并无限重启。多节点集群才需要设置且必须可解析。
      AUTHENTICATION_APIKEY_ENABLED: 'true'       # 启动 API Key 鉴权
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: '${WEAVIATE_API_KEY:-change-me-weaviate-key}'
      AUTHENTICATION_APIKEY_USERS: 'llmops@llmops.com'
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'
      AUTHORIZATION_ADMINLIST_USERS: 'llmops@llmops.com'
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    ports:
      - "${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./volumes/minio/data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── 腾讯记忆三件套 ────────────────────────────────────────────────────────
  # 镜像不认环境变量、必须挂配置文件：deploy.sh 会先从 .env 生成
  #   .runtime/tdai-gateway.yaml  → memory-core
  #   .runtime/proxy-config.yaml  → memory-proxy
  memory-core:
    image: ${MEMORY_CORE_IMAGE:-agentmemory/memory-core:latest}
    container_name: memory-core
    restart: always
    environment:
      TDAI_GATEWAY_PORT: 8420
      TDAI_GATEWAY_HOST: 0.0.0.0
      TDAI_GATEWAY_API_KEY: ${MEMORY_CORE_GATEWAY_API_KEY-}
    volumes:
      - ${MEMORY_CORE_VOLUME:-tdai-memory-core-data}:/data/tdai-memory
      - ./.runtime/tdai-gateway.yaml:/data/config/tdai-gateway.yaml:ro
    ports:
      - "${MEMORY_CORE_PORT:-8420}:8420"

  memory-hub:
    image: ${MEMORY_HUB_IMAGE:-agentmemory/memory-hub:latest}
    container_name: memory-hub
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PANEL_PORT: 8125
      KNOWLEDGE_PORT: 8424
      KNOWLEDGE_PUBLIC_BASE_URL: ${KNOWLEDGE_PUBLIC_BASE_URL:-http://host.docker.internal:8424/v3}
      REMOTE_INSTANCE_ID: default
      REMOTE_INSTANCE_NAME: default
      REMOTE_INSTANCE_URL: http://memory-core:8420
      # hub/proxy 的 gateway key 默认 "local"（与官方脚本一致）；留空时不能用空值
      REMOTE_INSTANCE_KEY: ${MEMORY_CORE_GATEWAY_API_KEY:-local}
      REMOTE_INSTANCE_PROXY_URL: ${MEMORY_HUB_PROXY_PUBLIC_URL-}
      LLM_MODE: custom                          # knowledge 直连 memory 组 LLM
      LLM_PROTOCOL: ${MEMORY_LLM_PROTOCOL:-openai}
      LLM_API_KEY: ${MEMORY_LLM_API_KEY}
      LLM_BASE_URL: ${MEMORY_LLM_BASE_URL}
      LLM_MODEL: ${MEMORY_LLM_MODEL}
      KNOWLEDGE_LLM_BINDING_SYNC: '0'
    volumes:
      - ${PANEL_VOLUME:-tdai-panel-data}:/data/knowledge
    ports:
      - "${PANEL_PORT:-8125}:8125"
      - "${KNOWLEDGE_PORT:-8424}:8424"
    depends_on:
      - memory-core

  memory-proxy:
    image: ${PROXY_IMAGE:-agentmemory/memory-proxy:latest}
    container_name: memory-proxy
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.runtime/proxy-config.yaml:/data/config.yaml:ro
    ports:
      - "${PROXY_PORT:-8096}:8096"
    depends_on:
      - memory-core
      - memory-hub

volumes:
  tdai-memory-core-data:
  tdai-panel-data:

networks:
  default:
    name: base-net
