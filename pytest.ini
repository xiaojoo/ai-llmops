[pytest]
# 设置测试缓存文件存储在tmp/.pytest_cache中
cache_dir = tmp/.pytest_cache

# 设置默认的命令行选项
addopts = -v -s
asyncio_default_fixture_loop_scope = function

# 在 pytest 默认排除项（.* / venv / build 等）之外追加环境杂项，
# 保证全量收集只含真实测试——tmp（gitignored，含历史 pytest-xdist 遗留缓存目录）、
# probe_dir/sandbox-tmp-probe（沙箱探针产物）、scripts（仅手工脚本，无 pytest 测试；
# scripts/tmp_*.py 会在模块级连真实浏览器导致收集失败）
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} tmp probe_dir sandbox-tmp-probe scripts

# 注册 slow 标记（门禁/慢速测试，默认不跑）
markers =
    slow: 慢速/门禁测试（PLAN2_GATES=1 时执行）
