# ═════════════════════════════════════════════════════════════════════════
# Jenkins 部署编排（自包含：llmops-db/redis/weaviate 随本编排拉起）
#
# 所有参数来自 jenkins/.env（模板 jenkins/.env.example），yaml 不写死密钥：
#   - 敏感项（JWT/COS/GITHUB/LLM/GAODE/LANGSMITH/各口令）只从 .env 读取（无默认值）
#   - 非敏感项（端口/池大小/数量/开关/域名）给 ${VAR:-默认值} 兜底
# compose 插值会自动读取本文件同目录的 .env；api/celery 额外 env_file 注入全量变量。
# 用法：
#   cp jenkins/.env.example jenkins/.env   # 填写真实值
#   docker compose -f jenkins/docker-compose.yaml up -d
# ═════════════════════════════════════════════════════════════════════════
services:
  llmops-api:
    image: ${IMAGE_NAME:-llmops-api}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: llmops-api
    restart: always
    env_file:
      - .env
    environment:
      # 模式为API，代表启用API服务
      MODE: api
    volumes:
      - ./volumes/app/storage:/app/storage
      - /data/llmops/llmops-api/internal/core/embeddings/bge-small-zh:/llmops/internal/core/embeddings/bge-small-zh
      - /data/llmops/llmops-api/internal/core/ltp:/llmops/internal/core/ltp
    ports:
      - "${LLMOPS_PORT:-5001}:5001"
    depends_on:
      - llmops-db
      - llmops-redis
      - llmops-weaviate
  llmops-celery:
    image: ${IMAGE_NAME:-llmops-api}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: llmops-celery
    restart: always
    env_file:
      - .env
    environment:
      # 模式为celery，代表启用celery异步任务队列
      MODE: celery
    volumes:
      - ./volumes/app/storage:/app/storage
      - /data/llmops/llmops-api/internal/core/embeddings/bge-small-zh:/llmops/internal/core/embeddings/bge-small-zh
      - /data/llmops/llmops-api/internal/core/ltp:/llmops/internal/core/ltp
    depends_on:
      - llmops-db
      - llmops-redis
      - llmops-weaviate
  llmops-redis:
    image: redis:6-alpine
    container_name: llmops-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./volumes/redis/data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
  llmops-db:
    image: postgres:15-alpine
    container_name: llmops-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-llmdb}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
  llmops-weaviate:
    image: semitechnologies/weaviate:1.28.4
    container_name: llmops-weaviate
    restart: always
    environment:
      QUERY_DEFAULTS_LIMIT: 25 #查询默认返回的数据条数
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false' # 需要授权才能和weaviate进行交互
      PERSISTENCE_DATA_PATH: /var/lib/weaviate # weoviate数据存储路径
      DEFAULT_VECTORIZER_MODULE: 'none' # 向量化模设置为none
      CLUSTER_HOSTNAME: ${WEAVIATE_CLUSTER_HOSTNAME:-node1} # 节点的主机名字
      AUTHENTICATION_APIKEY_ENABLED: 'true' # 启动基于API秘钥的身份校验
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY} # 允许的API秘钥
      AUTHENTICATION_APIKEY_USERS: 'llmops@llmops.com' # 基于秘钥的API身份列表
      AUTHORIZATION_ADMINLIST_ENABLED: 'true' # 启动AdminList授权方案
      AUTHORIZATION_ADMINLIST_USERS: 'llmops@llmops.com' # 使用AdminList方案时具有管理权限的用户
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    ports:
      - "${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
  llmops-nginx:
    image: nginx:latest
    container_name: llmops-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - llmops-api
