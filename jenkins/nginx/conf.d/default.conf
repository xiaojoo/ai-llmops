server {
    listen 80;
    server_name _;

    # 动态解析上游（Docker 内置 DNS）：llmops-api/llmops-web 容器重建换 IP 后自动跟随，
    # 无需重启本网关（此前静态解析导致部署后 502）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 将/api的请求代理到5001端口上(llmops-api服务)
    location /api/ {
        set $api_upstream http://llmops-api:5001;
        # 修复路径，避免/api后面的路径丢失（须在 set 之后，break 会截断本阶段后续指令）
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        include proxy.conf;

        # 显示Nginx默认错误页面
        proxy_intercept_errors off;
    }

    # 将/的请求转发到3000端口上(llmops-ui服务)
    location / {
        set $web_upstream http://llmops-web:3000;
        proxy_pass $web_upstream;
        include proxy.conf;
    }
}
