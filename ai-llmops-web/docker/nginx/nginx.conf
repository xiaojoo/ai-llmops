server {
    # 前端容器内部监听 3000（80 端口由 llmops-nginx 网关对外提供；compose 映射 3000:3000 供直连调试）
    listen 3000;
    server_name _;

    # 如果有其他文件（图片、字体、js脚本、样式表等），使用Nginx静态提供
    location ~* \.(?:css|js|jpe?g|gif|svg|woff|woff2|eot|ttf|otf|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 前端容器作为独立入口时（例如直接访问 http://192.168.31.194:3000），
    # 必须把 /api 请求转发到后端 (llmops-api:5001)。
    # 否则 /api 会落到下面 try_files -> /index.html，返回 HTML 而非 JSON，登录/OAuth 链路走不通。
    location /api/ {
        # 动态解析 llmops-api（Docker 内置 DNS 127.0.0.11）：
        # api 容器重建/换 IP 后自动跟随，无需重启本 nginx。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://llmops-api:5001;

        # 修复路径，避免/api后面的路径丢失
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 注意：/auth/authorize/* 是前端 SPA 自带路由（AuthorizeView 消费 GitHub code 后
    # POST /api/oauth/authorize），不要在这里代理 /auth/，让它落到下方 SPA fallback。

    # 访问静态页面时将路径转发到/index.html上，适用于单页面应用
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}